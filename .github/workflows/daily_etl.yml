name: Daily YouTube ETL

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-youtube-etl
  cancel-in-progress: false

jobs:
  run-etl:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run ETL pipeline
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python -m etl.main

      - name: Commit updated database
        run: |
          DB_PATH="data/yt_social_listening.duckdb"

          if [ ! -f "$DB_PATH" ]; then
            echo "Database was not created; nothing to commit."
            exit 0
          fi

          git add "$DB_PATH"

          if git diff --cached --quiet -- "$DB_PATH"; then
            echo "Database has not changed."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: update YouTube social listening database"
          git push
